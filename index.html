<!DOCTYPE html>
<html lang="kr">
<head>
    <link rel="stylesheet" href="css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to kokoa Talk</title>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar__column">
            <span>No service</span>
         <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="status-bar__column">
            <span>12:00</span>
        </div>
        <div class="status-bar__column">
            <span>100%</span>
            <i class="fa-solid fa-battery-full"></i>
            <i class="fa-solid fa-bolt"></i>
        </div>
    </div>

<header class="welcome-header">
    <h1 class="welcome-header__title">welcome to kokoa Clone</h1>
    <p class="welcome-header__text">if you have kokoa Account, log in with your Email or phone number</p>
</header>

<form id="login-form">
    <input type="text" placeholder="Email or phone number"/>
    <input type="password" placeholder="password"/>
    <input type="submit" value="Log in"/>
    <a href="#">Find kokoa Account or Password</a>
</form>

    <script src="https://kit.fontawesome.com/010ef19fc9.js" crossorigin="anonymous"></script>
</body>
</html>
