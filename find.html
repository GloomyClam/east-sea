<!DOCTYPE html>
<html lang="kr">
<head>
    <link rel="stylesheet" href="css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>find - kokoa clone</title>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar__column">
            <span>No service</span>
         <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="status-bar__column">
            <span>12:00</span>
        </div>
        <div class="status-bar__column">
            <span>100%</span>
            <i class="fa-solid fa-battery-full"></i>
            <i class="fa-solid fa-bolt"></i>
        </div>
    </div>

    

<nav class="nav">
    <ul class="nav__list">
        <li class="nav__btn"><a class="nav__link" href="friends.html"><i class="fa-regular fa-user fa-2x"></i></a></li>
        <li class="nav__btn"><a class="nav__link" href="chat.html">
            <span class="nav__notification badge">1</span>
            <i class="fa-regular fa-comment fa-2x"></i></a></li>
        <li class="nav__btn"><a class="nav__link" href="find.html"><i class="fa-solid fa-magnifying-glass fa-2x"></i></a></li>
        <li class="nav__btn"><a class="nav__link" href="more.html ">
            <span class="nav__end"></span>
            <i class="fa-solid fa-ellipsis fa-2x"></i></a></li>
    </ul>
</nav>
<header class="screen-header">
    <h1 class="screen-header__title">Finds</h1>
    <div class="screen-header__icons">
<span><i class="fa-solid fa-magnifying-glass fa-lg"></i></span>
<span class="gear-parent"><i class="fa-solid fa-gear fa-lg"></i><span class="gear-alerm"></span></span>
    </div>
</header>

<main class="main-screen">
        <div class="find-icons">
            <div class="find-icons__icon"><i class="fa-solid fa-qrcode"></i><span>QR code</span></div>
            <div class="find-icons__icon"><i class="fa-regular fa-address-book"></i><span>Add by Contacts</span></div>
            <div class="find-icons__icon"><i class="fa-solid fa-fingerprint"></i><span>Add by ID</span></div>
            <div class="find-icons__icon"><i class="fa-regular fa-envelope"></i><span>Invite</span></div>
        </div>

        <div class="recommended-friends">
                <h6 class="recommended-friends__title">Recommended friends</h6>
                <span>you have no friends. you suck.</span>
        </div>

        <div class="open-chat">
            <div class="open-chat__header">
                <h4>Open chat</h4>
                <span>Go to Openchat Home<i class="fa-solid fa-chevron-right fa-xs"></i></span>
            </div>
            <div class="open-post">
                <div class="open-post__column">
                    <h5 class="open-post__title">#Rx-7</h5>
                    <h6 class="open-post__hashtags">#jdm#rotary#1997</h6>
                    <div class="open-post__members">
                        <img src="img/userimg.jpg" />
                        <span class="open-post__members-count"> 80 members</span>
                        <div class="divider"></div>
                        <span class="open-post__members-status">Active</span>
                    </div>
                </div>
                <div class="open-post__column">
                    <div class="open-post__photo">
                        <img src="img/rx-7.jpg"/>
                            <div class="open-post__heart">
                                <i class="fa-solid fa-heart fa-xs"></i>
                                <span>26</span>
                            </div>
                    
                    </div>
                </div>
            </div>
        </div>
    </main>

        


    <script src="https://kit.fontawesome.com/010ef19fc9.js" crossorigin="anonymous"></script>
</body>
</html>
